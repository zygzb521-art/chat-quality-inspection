[pytest]
DJANGO_SETTINGS_MODULE = config.settings_local
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests