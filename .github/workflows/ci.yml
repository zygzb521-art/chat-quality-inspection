name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python + Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatinspect
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: chat_inspection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov ruff

      - name: Ruff lint
        run: |
          cd backend
          ruff check apps/ config/ tests/

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DB_USER: chatinspect
          DB_PASSWORD: testpass
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only
          DJANGO_ENV: development
        run: |
          cd backend
          pytest --cov=apps --cov-report=term-missing tests/

  frontend:
    name: Frontend (Vue + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npm run build

      - name: Build
        run: |
          cd frontend
          npm run build
          ls -la dist/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile -t chat-inspection-backend:test .

      - name: Build celery image
        run: docker build -f Dockerfile.celery -t chat-inspection-celery:test .